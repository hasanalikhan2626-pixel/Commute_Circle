<style>
/* Layout: sticky app bar; a 3-step student flow (Trip → Match → Group) in one centred column, map beside details on wide screens; admin as tabs */
:root{
  --bg:#F2F4F1; --surface:#FFFFFF; --surface-2:#E8EDE9; --line:#D2DBD5;
  --ink:#14302A; --muted:#566B64; --accent:#0E7A5C; --accent-ink:#FFFFFF; --accent-soft:#DCEFE7;
  --sign:#E5AE2E; --sign-soft:#FBEFD2; --sign-ink:#5A4106;
  --bad:#B4372B; --bad-soft:#F8E0DC; --good:#1E7F4E; --map:#F7F9F7; --road:#C9D3CD;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1513; --surface:#15201D; --surface-2:#1D2B27; --line:#2C3C37;
  --ink:#E4EDE9; --muted:#9BB0A9; --accent:#3BBE93; --accent-ink:#05251B; --accent-soft:#173D30;
  --sign:#E5AE2E; --sign-soft:#3A2E10; --sign-ink:#F5DD9C;
  --bad:#F0877B; --bad-soft:#3E1F1B; --good:#5FD39A; --map:#111B18; --road:#2C3C37; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1513; --surface:#15201D; --surface-2:#1D2B27; --line:#2C3C37;
  --ink:#E4EDE9; --muted:#9BB0A9; --accent:#3BBE93; --accent-ink:#05251B; --accent-soft:#173D30;
  --sign:#E5AE2E; --sign-soft:#3A2E10; --sign-ink:#F5DD9C;
  --bad:#F0877B; --bad-soft:#3E1F1B; --good:#5FD39A; --map:#111B18; --road:#2C3C37; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.logo{width:36px;height:36px;border-radius:9px;background:var(--accent);display:grid;place-items:center}
.brand h1{font-family:var(--f-display);font-size:1.3rem;margin:0;letter-spacing:-.01em;line-height:1.1}
.brand small{display:block;color:var(--muted);font-size:.8rem}
.tag{font-size:.7rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:var(--sign-soft);color:var(--sign-ink)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:99px;padding:3px}
.seg button{border:0;background:transparent;color:var(--muted);font:600 .9rem var(--f-body);padding:7px 16px;border-radius:99px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0/.15)}
.steps{display:flex;gap:6px;padding-block:0 12px;overflow-x:auto}
.step{display:flex;align-items:center;gap:8px;border:0;background:none;padding:6px 10px 6px 6px;border-radius:99px;font:600 .92rem var(--f-body);color:var(--muted);cursor:pointer;white-space:nowrap}
.step .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-size:.8rem}
.step[aria-current="step"]{background:var(--accent-soft);color:var(--accent)}
.step[aria-current="step"] .n{background:var(--accent);color:var(--accent-ink)}
.step.done .n{background:var(--accent-soft);color:var(--accent)}
.step:disabled{opacity:.45;cursor:not-allowed}
.sep{align-self:center;width:18px;height:2px;background:var(--line);flex:none}
main{padding-block:22px 64px}
h2{font-family:var(--f-display);font-size:clamp(1.4rem,1.1rem + 1.2vw,1.9rem);margin:0 0 6px;text-wrap:balance;letter-spacing:-.015em;line-height:1.15}
h3{font-family:var(--f-display);font-size:1.12rem;margin:0}
.lead{color:var(--muted);margin:0 0 20px;max-width:62ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.stack{display:flex;flex-direction:column;gap:16px}
.cols{display:grid;gap:18px;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
@media (max-width:860px){.cols{grid-template-columns:minmax(0,1fr)}}
.q{font-weight:700;margin:0 0 4px}
.hint{color:var(--muted);font-size:.88rem;margin:0}
select,input[type=text],input[type=number],input[type=time]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
input[type=time]{font-family:var(--f-mono);font-size:.95rem}
:focus-visible{outline:3px solid var(--sign);outline-offset:2px}
.btn{font:700 .95rem var(--f-body);border-radius:10px;padding:11px 18px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.big{padding:14px 22px;font-size:1rem}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:7px 12px;font-size:.86rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{font:600 .92rem var(--f-body);padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.opt[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.opt.day{min-width:52px;text-align:center}
.switch{display:flex;align-items:flex-start;gap:12px;cursor:pointer}
.switch input{width:20px;height:20px;margin-top:3px;accent-color:var(--accent);flex:none}
.notice{display:flex;gap:10px;padding:12px 14px;border-radius:10px;background:var(--sign-soft);color:var(--sign-ink);font-size:.9rem}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:.78rem;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--surface-2);color:var(--ink);white-space:nowrap}
.badge.ok{background:var(--accent-soft);color:var(--accent)}
.badge.sign{background:var(--sign-soft);color:var(--sign-ink)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
/* map */
.map{width:100%;height:auto;display:block;border-radius:10px;background:var(--map);border:1px solid var(--line)}
.map text{font-family:var(--f-body)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
/* match */
.fit{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:10px;background:var(--accent-soft)}
.fit b{font:700 2rem var(--f-display);color:var(--accent);line-height:1}
.fit .t{font-weight:700}
.member{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.member:first-child{border-top:0}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:700 .95rem var(--f-display);background:var(--surface-2);color:var(--ink);position:relative}
.av .o{position:absolute;right:-3px;bottom:-3px;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font:700 .7rem var(--f-body);display:grid;place-items:center;border:2px solid var(--surface)}
.nm{font-weight:700}
.sub{color:var(--muted);font-size:.86rem}
.facts{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.why{margin-top:4px}
.why summary{cursor:pointer;font-weight:700;color:var(--accent);font-size:.92rem}
.bk{width:100%;border-collapse:collapse;font-size:.9rem;margin-top:8px}
.bk td,.bk th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
.bk th{font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.mbar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;width:90px}
.mbar i{display:block;height:100%;background:var(--accent)}
/* today */
.today{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
.tile{padding:14px;border-radius:10px;background:var(--surface-2)}
.tile b{display:block;font:700 1.35rem var(--f-display)}
.tile span{color:var(--muted);font-size:.84rem}
.ck{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ck button{padding:16px;font-size:1.02rem}
.ck button[aria-pressed="true"].go{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.ck button[aria-pressed="true"].no{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.who-row{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:.95rem}
.st{font-weight:700;font-size:.88rem}
.st.go{color:var(--good)} .st.no{color:var(--bad)} .st.wait{color:var(--muted)}
.tt{width:100%;border-collapse:collapse;font-size:.92rem}
.tt th{text-align:left;font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px;border-bottom:1px solid var(--line)}
.tt td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.scroll{overflow-x:auto}
.acct{display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--muted);font-weight:600}.acct select{width:auto;max-width:210px;padding:7px 10px;font-size:.88rem}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.kpi{padding:14px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.kpi b{display:block;font:700 1.8rem var(--f-display)}
.kpi span{color:var(--muted);font-size:.86rem}
.atabs{display:flex;gap:4px;padding-block:0 0;overflow-x:auto}
.atabs button{border:0;background:none;font:600 .95rem var(--f-body);color:var(--muted);padding:10px 12px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.atabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.empty{color:var(--muted);text-align:center;padding:28px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:10px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 32px);z-index:20}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:560px){.brand small{display:none}.card{padding:16px}.tag{display:none}}

.hero{border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line);background:var(--surface)}

.hero.done{background:var(--surface);border-color:var(--accent)}

.eyebrow{font-size:.76rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.big{font-size:1.05rem;margin:4px 0 0}
.link{background:none;border:0;padding:0;color:var(--accent);font:700 .92rem var(--f-body);cursor:pointer;text-align:left;text-decoration:underline;text-underline-offset:3px}
.ck{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tiles{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
.tile.accent{background:var(--accent-soft)} .tile.accent b{color:var(--accent)}
.opt.ghost{border-style:dashed;color:var(--muted)}

.av.sm{width:34px;height:34px;font-size:.8rem}

.fare{border-color:var(--sign);background:var(--sign-soft)}
.wk{display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px;align-items:center;margin-bottom:10px}
.bars{display:flex;flex-direction:column;gap:4px}
.sbar{height:20px;border-radius:5px;min-width:2px;position:relative}
.sbar span{position:absolute;left:8px;top:1px;font:600 .78rem var(--f-mono);color:var(--ink);white-space:nowrap}
.sbar.solo{background:var(--road)} .sbar.paid{background:var(--accent)} .sbar.paid span{color:var(--accent-ink)}
.daybars{display:flex;align-items:flex-end;gap:4px;height:170px;padding-top:18px}
.db{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative;min-width:0}
.db i{display:block;width:100%;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
.db .v{font-size:.68rem;color:var(--muted)} .db .l{font-size:.68rem;color:var(--muted);margin-top:4px}
.db:last-child i{background:var(--sign)}
.hero.quiet{background:var(--surface-2)}
[hidden]{display:none!important}
.wa{background:var(--surface-2);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;font-size:.88rem}
.bub{max-width:85%;padding:7px 10px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.bub.out{align-self:flex-end;background:var(--accent-soft);border-color:var(--accent);font-family:var(--f-mono)}
</style>

const rad=x=>x*Math.PI/180;
function km(a,b){const R=6371,dl=rad(b[0]-a[0]),dn=rad(b[1]-a[1]);const h=Math.sin(dl/2)**2+Math.cos(rad(a[0]))*Math.cos(rad(b[0]))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
const P=s=>AREAS[s.area], C=[CAMPUS.lat,CAMPUS.lon];
const mins=t=>{const [h,m]=t.split(':').map(Number);return h*60+m};
function allowed(a,b){ if(a.womenOnly&&b.g!=='F') return false; if(b.womenOnly&&a.g!=='F') return false; return true; }
// detour: extra distance if one picks up the other on the way to campus (best order)
function detour(a,b){const ac=km(P(a),C),bc=km(P(b),C),ab=km(P(a),P(b));
  const viaB=(ab+bc)/ac-1, viaA=(ab+ac)/bc-1; return Math.max(0,Math.min(viaB,viaA));}
function pair(a,b){
  if(!allowed(a,b)) return null;
  const d=km(P(a),P(b)), det=detour(a,b);
  const route=Math.max(0,40*(1-det/0.35));            // 0% detour → 40, 35%+ → 0
  const near=Math.max(0,20*(1-(d-1.5)/6.5)), nearS=Math.min(20,near); // ≤1.5 km → 20, ≥8 km → 0
  const myDays=DAYS.filter(x=>a.tt[x].on);
  const fits=myDays.map(x=>{ if(!b.tt[x].on) return {x,ok:0};
    const di=Math.abs(mins(a.tt[x].in)-mins(b.tt[x].in)), dout=Math.abs(mins(a.tt[x].out)-mins(b.tt[x].out));
    const f=v=>v<=15?1:v<=30?.5:0; return {x,ok:(f(di)*0.7+f(dout)*0.3),di,dout};});
  const sched=myDays.length?30*fits.reduce((t,f)=>t+f.ok,0)/myDays.length:0;
  const common=a.methods.filter(m=>b.methods.includes(m)); const pref=common.length?10:0;
  const total=Math.round(route+nearS+sched+pref);
  const goodDays=fits.filter(f=>f.ok>=.7).map(f=>f.x);
  return {total,route:Math.round(route),near:Math.round(nearS),sched:Math.round(sched),pref,d,det,goodDays,common,
    onWay:det<=0.12};
}
const MIN=45;
function pool(){return students.filter(s=>s.status==='approved'&&!s.me);}
function buildGroup(seedFirst){
  const m=me(), target=m.size;
  let grp=[m]; let cands=pool().filter(c=>{const p=pair(m,c);return p&&p.total>=MIN&&p.goodDays.length>0;});
  if(seedFirst){ if(!cands.includes(seedFirst)) return null; grp.push(seedFirst); }
  while(grp.length<target){
    let best=null,bestV=-1;
    cands.filter(c=>!grp.includes(c)).forEach(c=>{
      const ps=grp.map(g=>pair(g,c)); if(ps.some(p=>!p||p.total<MIN-10||!p.goodDays.length)) return;
      if(!DAYS.some(d=>[...grp,c].every(s=>s.tt[d].on&&Math.abs(mins(s.tt[d].in)-mins(m.tt[d].in))<=20))) return;
      const v=Math.min(...ps.map(p=>p.total))*0.6+pair(m,c).total*0.4;
      if(v>bestV){bestV=v;best=c;}});
    if(!best) break; grp.push(best);
  }
  return grp.length>1?grp:null;
}
function groupInfo(grp){
  const m=grp[0];
  const order=[...grp].sort((a,b)=>km(P(b),C)-km(P(a),C)); // furthest from campus is picked up first
  let dist=0; for(let i=0;i<order.length-1;i++) dist+=km(P(order[i]),P(order[i+1])); dist+=km(P(order.at(-1)),C);
  const roadKm=dist*ROAD;
  const scores=[]; for(let i=0;i<grp.length;i++)for(let j=i+1;j<grp.length;j++){const p=pair(grp[i],grp[j]);scores.push(p?p.total:0);}
  const fit=Math.round(scores.reduce((t,v)=>t+v,0)/scores.length);
  const days=DAYS.filter(d=>grp.every(s=>s.tt[d].on&&Math.abs(mins(s.tt[d].in)-mins(m.tt[d].in))<=20));
  return {order,roadKm,fit,days,soloKm:km(P(m),C)*ROAD};
}

  const n=[...t.st.values()].filter(x=>x==='went').length; [...t.st.keys()].forEach(s=>{ if(s.area===area&&t.st.get(s)==='went') v.push(t.total/n);});});return v;}
function streak(c){let n=0;for(let i=PAST.length-1;i>=0;i--){const k=dkey(PAST[i]);const t=trips.find(x=>x.cid===c.id&&x.date===k);
  if(!t){ if(travelDays(c).includes(DOW(PAST[i]))) break; else continue;} if(t.confirmedBy) n++; else break;}return n;}

/* ----- state ----- */
let role='student', tab='today', admTab='usage', options=null, optIx=0, reports=[{id:1,from:'Taha Rizvi',about:'Kashif Noor',reason:'Repeatedly no-show',detail:'Marked going three times last week but did not turn up.',status:'Open',when:'Yesterday'}];
let tomorrowOff=new Set(); // students who tapped "Not going tomorrow"
function todayTrip(c){return trips.find(t=>t.cid===c.id&&t.date===dkey(TODAY));}
function ensureToday(c){let t=todayTrip(c); if(t) return t; const pl=c.members.filter(s=>plannedOn(c,s,TODAY)); if(pl.length<2&&!pl.includes(me())) return null;
  const st=new Map(); pl.forEach(s=>st.set(s,'planned')); t={date:dkey(TODAY),cid:c.id,st,confirmedBy:null,mode:c.mode,total:null,today:true}; trips.push(t); return t;}

/* ----- money, rota, guest seat, re-match ----- */
const wentN=t=>[...t.st.values()].filter(v=>v==='went').length;
function circleTrips(c){return trips.filter(t=>t.cid===c.id&&t.confirmedBy);}
function balances(c){const net=new Map(c.members.map(s=>[s,0]));
  circleTrips(c).forEach(t=>{ if(!(t.total>0)||!t.payer||t.date<=c.settledUntil) return; const n=wentN(t); if(!n) return;
    t.st.forEach((v,s)=>{ if(v==='went'&&net.has(s)) net.set(s,net.get(s)-t.total/n);}); if(net.has(t.payer)) net.set(t.payer,net.get(t.payer)+t.total);});
  c.settlements.forEach(x=>{ if(net.has(x.from)) net.set(x.from,net.get(x.from)+x.amt); if(net.has(x.to)) net.set(x.to,net.get(x.to)-x.amt);});
  return net;}
function settleLines(c){const net=balances(c);const deb=[],cre=[];net.forEach((v,s)=>{ if(v<-5) deb.push([s,-v]); else if(v>5) cre.push([s,v]);});
  deb.sort((a,b)=>b[1]-a[1]);cre.sort((a,b)=>b[1]-a[1]);const out=[];let i=0,j=0;
  while(i<deb.length&&j<cre.length){const a=Math.min(deb[i][1],cre[j][1]);out.push({from:deb[i][0],to:cre[j][0],amt:Math.round(a/10)*10});deb[i][1]-=a;cre[j][1]-=a;if(deb[i][1]<5)i++;if(cre[j][1]<5)j++;}
  return out.filter(x=>x.amt>0);}
const ROTA_MODES=['Family driver','Parent drop','Classmate drives'];
function rotaDates(c,n=10){const out=[];const d=new Date(TODAY);while(out.length<n){ if(![0,6].includes(d.getDay())&&travelDays(c).includes(DOW(d))) out.push(new Date(d)); d.setDate(d.getDate()+1);}return out;}
function rotaFor(c){const el=c.members.filter(s=>s.methods.includes(c.mode));const who=el.length?el:c.members;
  return rotaDates(c).map((d,i)=>({d,s:c.rotaOver[dkey(d)]||who[i%who.length]}));}
const driveLabel=(c,s)=>c.mode==='Classmate drives'?(s.me?'You drive':esc(short(s.name))+' drives'):c.mode==='Family driver'?(s.me?'Your family driver':esc(short(s.name))+'’s family driver'):(s.me?'Your parent drops':esc(short(s.name))+'’s parent drops');
let guest=null, seatOpen=false, rematch=false;
function seatOptions(){const m=me(),mc=circleOf(m);const d=DOW(TODAY);
  return circles.filter(c=>c!==mc&&c.members.every(s=>allowed(m,s))&&travelDays(c).includes(d)).map(c=>{
    const going=c.members.filter(s=>plannedOn(c,s,TODAY)&&!tomorrowOff.has(s)).length - (c.id%3===0?1:0); const free=4-going;
    const near=Math.min(...c.members.map(s=>km(P(m),P(s)))); const onw=c.members.some(s=>detour(m,s)<=0.12);
    const ref=c.members[0]; const dt=Math.abs(mins(ref.tt[d].in)-mins(m.tt[d].in));
    return {c,near,onw,dt,free};}).filter(x=>x.free>0&&(x.near<=8||x.onw)&&x.dt<=30).sort((a,b)=>a.near-b.near).slice(0,3);}

    const neg=feedback.filter(f=>!f.up&&c.members.includes(f.to)).length; return {c,rate:pl?Math.round(dn/pl*100):0,ns,neg,streak:streak(c)};}).sort((a,b)=>a.rate-b.rate);
  return `<h2>Circle health</h2><p class="lead">Circles with low completion, no-shows or private negative feedback, so Student Affairs can help early.</p>
  <section class="card"><div class="scroll"><table class="tt"><thead><tr><th>Circle</th><th>Area(s)</th><th style="text-align:right">Completed</th><th style="text-align:right">No-shows</th><th style="text-align:right">Negative feedback</th><th style="text-align:right">Streak</th><th></th></tr></thead><tbody>
  ${rows.map(r=>`<tr><td>${r.c.members.map(s=>esc(short(s.name))).join(', ')}</td><td class="sub">${[...new Set(r.c.members.map(s=>sa(s.area)))].join(', ')}</td><td class="mono" style="text-align:right">${r.rate}%</td><td class="mono" style="text-align:right">${r.ns}</td><td class="mono" style="text-align:right">${r.neg}</td><td class="mono" style="text-align:right">${r.streak}</td>
   <td>${r.rate<75||r.ns>=3||r.neg>=2?'<span class="badge bad">Check in</span>':'<span class="badge ok">Healthy</span>'}</td></tr>`).join('')}</tbody></table></div></section>`;
}
function vApprove(){
  const p=students.filter(s=>s.status==='pending');
  return `<h2>Approvals</h2><p class="lead">Check each sign-up against the student record. Members accept the Terms, Privacy Notice and Code of Conduct at sign-up; acceptance is logged.</p>
  <section class="card">${p.length?`<div class="scroll"><table class="tt"><thead><tr><th>Name</th><th>Programme</th><th>Area</th><th>Terms accepted</th><th></th></tr></thead><tbody>
   ${p.map(s=>`<tr><td><b>${esc(s.name)}</b><br><span class="sub mono">${esc(s.name.toLowerCase().replace(' ','.'))}@bic.edu.pk</span></td><td>${esc(s.prog)} · Y${s.year}</td><td>${esc(s.area)}</td><td class="sub">v1.0 · ${fmt(PAST.at(-2))}</td><td><div class="row" style="flex-wrap:nowrap"><button class="btn sm primary" data-ap="${s.id}">Approve</button><button class="btn sm" data-rj="${s.id}">Reject</button></div></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No sign-ups waiting.</div>'}</section>`;
}
function bindApprove(){
  document.querySelectorAll('[data-ap]').forEach(b=>b.onclick=()=>{students.find(s=>s.id==b.dataset.ap).status='approved';fillAcct();render();toast('Member approved');});
  document.querySelectorAll('[data-rj]').forEach(b=>b.onclick=()=>{students.find(s=>s.id==b.dataset.rj).status='rejected';render();toast('Sign-up rejected');});
}
function vReports(){
  const neg=feedback.filter(f=>!f.up);
  return `<h2>Reports</h2><p class="lead">Reports need a decision. Private negative feedback is shown below for context; it is never visible to other students.</p>
  <div class="stack">${reports.length?reports.map(r=>`<section class="card"><div class="row" style="justify-content:space-between"><h3>${esc(r.reason)}</h3><span class="badge ${r.status==='Open'?'bad':'ok'}">${r.status}</span></div>
   <p style="margin:8px 0">${esc(r.detail)}</p><p class="hint" style="margin-bottom:12px">From ${esc(r.from)} · About ${esc(r.about)} · ${r.when}</p>
   ${r.status==='Open'?`<div class="row"><button class="btn sm primary" data-res="${r.id}">Mark resolved</button><button class="btn sm danger" data-sus="${r.id}">Suspend member</button></div>`:''}</section>`).join(''):'<div class="card empty">No reports.</div>'}
  <section class="card"><h3 style="margin-bottom:8px">Private negative feedback (${neg.length})</h3><div class="scroll"><table class="tt"><thead><tr><th>About</th><th>Reason</th><th>From</th></tr></thead><tbody>${neg.map(f=>`<tr><td>${esc(f.to.name)}</td><td>${esc(f.tag)}</td><td class="sub">${f.from?esc(f.from.name):'Circle member'}</td></tr>`).join('')}</tbody></table></div></section></div>`;
}
function bindReports(){
  document.querySelectorAll('[data-res]').forEach(b=>b.onclick=()=>{reports.find(r=>r.id==b.dataset.res).status='Resolved';render();toast('Report resolved');});
  document.querySelectorAll('[data-sus]').forEach(b=>b.onclick=()=>{const r=reports.find(r=>r.id==b.dataset.sus);r.status='Member suspended';const s=students.find(x=>x.name===r.about);if(s)s.status='suspended';render();toast('Member suspended');});
}

/* ===== Render ===== */
function render(){
  renderNav(); let v;
  if(role==='student') v={today:[vToday,bindToday],circle:[vCircle,bindCircle],money:[vMoney,bindMoney],find:[vFind,bindFind],insights:[vInsights,()=>{}]}[tab];
  else v={usage:[vUsage,()=>{}],fares:[vFares,()=>{}],health:[vHealth,()=>{}],approve:[vApprove,bindApprove],reports:[vReports,bindReports]}[admTab];
  $('#view').innerHTML=v[0](); v[1]();
}
fillAcct(); render();

</script>
</html>
